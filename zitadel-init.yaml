# ZITADEL FirstInstance — nur beim Erst-Bootstrap geladen (--steps).
# Erzeugt Instanz-Admin + eine Maschinen-User-PAT, die der bootstrap-Service
# nutzt, um Orgs/Projekt/OIDC-App/User idempotent via API anzulegen.
FirstInstance:
  PatPath: /bootstrap/admin-client.pat
  Org:
    Name: Demo
    Human:
      UserName: admin
      Password: "Demo1!Admin"
      FirstName: Admin
      LastName: User
      Email:
        Address: admin@localhost
        Verified: true
      PreferredLanguage: en
      PasswordChangeRequired: false
    Machine:
      Machine:
        Username: admin-client
        Name: Admin Client
      Pat:
        ExpirationDate: "2099-01-01T00:00:00Z"
