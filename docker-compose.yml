# =============================================================================
# zitadel-pgrst-auth — reproduzierbares Deliverable
# `docker compose up` -> Postgres+auth-Schema, Zitadel (Bootstrap: 2 Firmen,
# staff/customer-User, OIDC-App), PostgREST (JWKS/RS256), statischer Login.
# Definition of Done: Login funktioniert, Mandantentrennung sichtbar.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appdb
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./auth:/sql/auth:ro
      - ./examples/products/db:/sql/example:ro
      - ./init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-latest}
    # Demo: als root, damit die FirstInstance-PAT ins frische Named-Volume
    # /bootstrap geschrieben werden kann (sonst "permission denied").
    user: "0:0"
    restart: unless-stopped
    command: >
      start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode disabled
      --steps /init/zitadel-init.yaml
    environment:
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALPORT: ${ZITADEL_PORT:-8088}
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_ADMIN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
    volumes:
      - ./zitadel-init.yaml:/init/zitadel-init.yaml:ro
      - zbootstrap:/bootstrap
    ports:
      - "${ZITADEL_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready", "--config", "/init/zitadel-init.yaml"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    image: alpine:3.20
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    environment:
      ZITADEL_API: http://zitadel:8080
      ZITADEL_ISSUER: http://localhost:${ZITADEL_PORT:-8088}
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: appdb
      LOGIN_ORIGIN: http://localhost:${LOGIN_PORT:-8089}
      POSTGREST_PORT: ${POSTGREST_PORT:-3001}
      DEMO_USER_PASSWORD: Demo1!Pass
    volumes:
      - ./bootstrap:/scripts:ro
      - zbootstrap:/bootstrap:ro
      - shared:/shared
    depends_on:
      zitadel:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgrest:
    image: postgrest/postgrest:latest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/appdb
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_user
      PGRST_DB_PRE_REQUEST: auth.ensure_principal
      PGRST_JWT_SECRET: "@/shared/jwks.json"
      PGRST_SERVER_PORT: 3000
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - shared:/shared:ro
    ports:
      - "${POSTGREST_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  # Angular-Beispiel-App auf dem generischen Auth-Baustein (src/auth).
  web:
    build:
      context: .
      dockerfile: examples/products/web/Dockerfile
    restart: unless-stopped
    volumes:
      - shared:/shared:ro
    ports:
      - "${LOGIN_PORT:-8089}:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  pgdata:
  zbootstrap:
  shared:
